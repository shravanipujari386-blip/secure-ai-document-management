
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Upload Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #172033;
            margin: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccd2dc;
            border-radius: 5px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .button {
            display: inline-block;
            padding: 11px 16px;
            margin-top: 20px;
            margin-right: 8px;
            border: none;
            border-radius: 5px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back-button {
            background: #153e75;
        }

        .muted {
            color: #667085;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Upload Document</h1>

    <p class="muted">
        Upload an official document to the document management system.
    </p>

    <div class="card">

        <form th:action="@{/documents/upload}"
              method="post"
              enctype="multipart/form-data">

            <!-- CSRF security token -->
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="title">Document Title</label>
            <input type="text"
                   id="title"
                   name="title"
                   required>

            <label for="description">Description</label>
            <textarea id="description"
                      name="description"></textarea>

            <label for="category">Document Category</label>
            <select id="category" name="category" required>
                <option value="CASE_DOCUMENT">Case Document</option>
                <option value="EVIDENCE">Evidence</option>
                <option value="REPORT">Report</option>
                <option value="OTHER">Other</option>
            </select>

            <label for="file">Select Document</label>
            <input type="file"
                   id="file"
                   name="file"
                   accept=".pdf,.png,.jpg,.jpeg"
                   required>

            <button type="submit" class="button">
                Upload Document
            </button>

            <a th:href="@{/documents}" class="button back-button">
                Back to Documents
            </a>

        </form>

    </div>

</div>

</body>
</html>
